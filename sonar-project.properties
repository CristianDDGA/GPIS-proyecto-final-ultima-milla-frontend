sonar.organization=cristianddga
sonar.projectKey=CristianDDGA_GPIS-proyecto-final-ultima-milla-frontend
sonar.projectName=GPIS Ultima Milla Frontend
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
# Las pruebas E2E (Playwright + API simulada), la configuración de herramientas y el código móvil no son código de producción.
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,mobile/**,e2e/**,cypress/**,cypress.config.js,playwright-report/**,test-results/**,playwright.config.ts,eslint.config.js,vite.config.ts,vitest.config.ts,**/*.css,src/test/**,**/*.test.ts,**/*.test.tsx

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# La cobertura se mide sobre la lógica (dominio, aplicación e infraestructura); las vistas React
# visuales (WebGL, Liquid Glass, mapas) se validan con Playwright (e2e/) y revisión manual.
sonar.coverage.exclusions=src/bootstrap/**,src/features/**/presentation/**,src/shared/ui/**,src/vite-env.d.ts,e2e/**,playwright.config.ts,eslint.config.js,vite.config.ts,mobile/**
sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**
