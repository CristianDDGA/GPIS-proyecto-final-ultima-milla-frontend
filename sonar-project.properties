sonar.organization=cristianddga
sonar.projectKey=CristianDDGA_GPIS-proyecto-final-ultima-milla-frontend
sonar.projectName=GPIS Ultima Milla Frontend
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,mobile/**,**/*.css,src/test/**,**/*.test.ts,**/*.test.tsx,e2e/**,playwright.config.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# La cobertura se mide sobre la lógica (dominio, aplicación e infraestructura); las vistas React
# visuales (WebGL, Liquid Glass, mapas) se validan con Cypress y revisión manual.
sonar.coverage.exclusions=src/bootstrap/**,src/features/**/presentation/**,src/shared/ui/**,src/vite-env.d.ts,e2e/**,playwright.config.ts
sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.test.tsx
